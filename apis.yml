aid: goto
name: GoTo
description: >-
  GoTo (PT GoTo Gojek Tokopedia Tbk, IDX: GOTO) is the largest technology group
  in Indonesia, formed in May 2021 through the merger of the on-demand and
  ride-hailing pioneer Gojek and the e-commerce marketplace Tokopedia. GoTo
  operates a super-app ecosystem spanning on-demand services (ride-hailing, food
  and grocery delivery, logistics), e-commerce, and financial technology through
  GoTo Financial (including GoPay, one of Indonesia's leading digital wallets).
  The group serves Indonesia's population of more than 270 million, connecting
  tens of millions of consumers with millions of merchants and driver-partners,
  and is estimated to contribute roughly 2 percent of Indonesia's GDP. GoTo is
  backed by a roster of blue-chip investors including SoftBank Vision Fund,
  Alibaba, Google, Tencent, Temasek, and Sequoia Capital India. This company
  profile was surfaced as a SoftBank Vision Fund portfolio company and enriched
  by the API Evangelist pipeline. Note that GoTo Group's developer surfaces are
  published per product (Gojek/GoBiz, Tokopedia, GoTo Financial/Midtrans) rather
  than at a single group-level developer portal; this record profiles the parent
  holding company.
